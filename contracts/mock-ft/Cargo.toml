[package]
name = "mock-ft"
version = "0.1.0"
edition = "2021"
description = "Testnet-only mock NEP-141 subscription token (G02): standard FungibleToken with metadata and storage management. NEVER for mainnet; clearly labeled in ft_metadata."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
